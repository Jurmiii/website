<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
    <section id="contact-header">
        <div class="container">
            <nav>
                <div class="logo">
                    <h1>EARTH</h1>
                </div>
                <ul class="nav-links">
                    <li><a href="./index.html">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Services</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
                <div class="menu-btn"><img src="./assets/images/menu.svg" alt="menu"></div>
            </nav>

            <div class="header-content">
                <h1>CONTACT US</h1>
            </div>
        </div>
    </section>

    <section id="contact-us" class="container">
        <form action="#">
            <h1>GET IN TOUCH</h1>

            <div class="inputsWrapper">
                <input type="text" placeholder="Your Name" />
                <input type="text" placeholder="Phome Number" />
                <input type="email" name="" id="" placeholder="Email" />
                <textarea name="message" id="" cols="30" rows="10"></textarea>
                <button class="primary-btn">SEND NOW</button>
            </div>
        </form>

        <div class="address">
            <h1>Talk to us</h1>

            <div class="datailsWrapper">
                <div class="detail">
                    <img src="/assets/images/email.png" alt="email">
                    <div class="text">
                        <h6>EMAIL</h6>
                        <p>something@example.com</p>
                    </div>
                </div>
                <div class="detail">
                    <img src="/assets/images/phone.png" alt="phone">
                    <div class="text">
                        <h6>PHONE NUMBER</h6>
                        <p>+91 91919191991</p>
                    </div>
                </div>
                <div class="detail">
                    <img src="/assets/images/location.png" alt="location">
                    <div class="text">
                        <h6>ADDRESS</h6>
                        <p>2727 Ocean Road, <br />
                            Malibu, CA, 90264
                        </p>
                    </div>
                </div>
            </div>

            <div class="followUsWrapper">
                <h3>Follow Us</h3>
                <ul class="socialLink">
                    <li><a href=""> <img src="./assets/images/facebook.png" alt="facebook"></a></li>
                    <li><a href=""> <img src="./assets/images/linkedin.png" alt="linkedin"></a></li>
                    <li><a href=""> <img src="./assets/images/video.png" alt="video"></a></li>
                </ul>
            </div>
        </div>
    </section>

    <footer>
        <ul class="footerlinks">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
        <h1 class="logo">EARTH</h1>
        <p>c2022 Earth. All right reserved.</p>
    </footer>

    <script>
        const menuBtn = document.querySelector('.menu-btn')
        const navLinks = document.querySelector('.nav-links')

        menuBtn.addEventListener('click', function () {
            navLinks.classList.toggle('active')
        })
    </script>
</body>

</html>
